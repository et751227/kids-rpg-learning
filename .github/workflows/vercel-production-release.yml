name: Kids Vercel Production Release

on:
  pull_request:
    paths:
      - ".github/workflows/vercel-production-release.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: kids-vercel-production-release
  cancel-in-progress: false

jobs:
  verify-workflow:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64, life-core, general-ci]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify production-only release boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'target:"production"' .github/workflows/vercel-production-release.yml
          ! grep -Fq 'release-preview' .github/workflows/vercel-production-release.yml
          grep -Fq 'VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}' .github/workflows/vercel-production-release.yml

  deploy:
    if: >-
      github.event_name == 'issue_comment' &&
      github.actor == 'et751227' &&
      github.event.issue.title == 'OPS: kids learning release control' &&
      github.event.comment.body == '/release-production-main'
    runs-on: [self-hosted, linux, x64, life-core, general-ci]
    timeout-minutes: 15
    env:
      VERCEL_TEAM_ID: team_NeSOdC6JTV1nSbIXrzLhdhdS
      VERCEL_PROJECT_ID: prj_JzsuuFKzhP6GpuieneGtN3I9VG8O
      VERCEL_PROJECT_NAME: kids-rpg-learning
      GITHUB_REPO_ID: "975869181"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require deployment credential
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VERCEL_TOKEN" ]] || { echo 'VERCEL_TOKEN repository secret is not configured.' >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify web and serverless source
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          npm run build
          node --check server/learning-proxy.cjs
          for file in api/learning/*.js; do node --check "$file"; done

      - name: Create Vercel production deployment
        id: create
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg name "$VERCEL_PROJECT_NAME" --arg sha "$COMMIT_SHA" --arg repoId "$GITHUB_REPO_ID" '{name:$name,target:"production",gitSource:{type:"github",repoId:($repoId|tonumber),ref:"main",sha:$sha}}')
          code=$(curl --silent --show-error -o /tmp/kids-vercel-create.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" -H 'Content-Type: application/json' \
            "https://api.vercel.com/v13/deployments?teamId=$VERCEL_TEAM_ID&forceNew=1" --data "$payload")
          [[ "$code" -ge 200 && "$code" -lt 300 ]] || { jq '{error}' /tmp/kids-vercel-create.json >&2 || true; exit 1; }
          id=$(jq -r '.id // empty' /tmp/kids-vercel-create.json)
          [[ -n "$id" ]] || exit 1
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for Vercel READY
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.create.outputs.deployment_id }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            code=$(curl --silent --show-error -o /tmp/kids-vercel-status.json -w '%{http_code}' \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID?teamId=$VERCEL_TEAM_ID")
            [[ "$code" -ge 200 && "$code" -lt 300 ]] || exit 1
            state=$(jq -r '.readyState // .state // empty' /tmp/kids-vercel-status.json)
            if [[ "$state" == 'READY' ]]; then
              jq '{id,url,target,readyState}' /tmp/kids-vercel-status.json
              exit 0
            fi
            [[ "$state" != 'ERROR' && "$state" != 'CANCELED' ]] || exit 1
            sleep 5
          done
          exit 1
